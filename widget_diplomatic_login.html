<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Russia–Africa Summit 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #050a14;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #FFFFFF;
      background-image: 
        radial-gradient(ellipse 90% 60% at 50% -20%, rgba(14, 60, 140, 0.5), transparent 70%),
        radial-gradient(ellipse 60% 40% at 85% 100%, rgba(0, 168, 120, 0.18), transparent 70%),
        radial-gradient(ellipse 50% 50% at 10% 90%, rgba(200, 30, 40, 0.15), transparent 70%);
      background-attachment: fixed;
    }

    /* Main High-End Card Container */
    .widget-container {
      width: 100%;
      max-width: 430px;
      background: #081326;
      border-radius: 28px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 
        0 30px 90px rgba(0, 0, 0, 0.85),
        0 0 0 1px rgba(255, 255, 255, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    /* Top Official Brand Section */
    .widget-header {
      background: #FFFFFF;
      padding: 24px 22px 20px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-bottom: 2px solid #E2E8F0;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #F1F5F9;
      color: #64748B;
      font-size: 20px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .close-btn:hover {
      background: #E2E8F0;
      color: #0F172A;
      transform: scale(1.05);
    }

    /* Flawless high-res official logo */
    .logo-container {
      width: 100%;
      max-width: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 4px 2px;
    }
    .logo-container img {
      width: 100%;
      height: auto;
      display: block;
      filter: contrast(1.03);
    }

    /* Deep Diplomatic Blue Body */
    .widget-body {
      padding: 28px 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: linear-gradient(180deg, #09152E 0%, #060D1E 100%);
      position: relative;
    }

    /* Subtle Gold Accent Ribbon */
    .diplomatic-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(229, 178, 86, 0.12);
      border: 1px solid rgba(229, 178, 86, 0.35);
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #F8D37D;
      margin-bottom: 14px;
    }
    .diplomatic-tag svg {
      width: 13px;
      height: 13px;
      fill: #F8D37D;
    }

    .title-main {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      line-height: 1.25;
      color: #FFFFFF;
      margin-bottom: 8px;
    }

    .title-sub {
      font-size: 13.5px;
      font-weight: 500;
      color: #94A9CF;
      margin-bottom: 20px;
    }

    /* Schedule / Location Plate */
    .event-meta-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
      backdrop-filter: blur(10px);
    }

    .meta-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .meta-divider {
      width: 1px;
      height: 36px;
      background: rgba(255, 255, 255, 0.1);
    }

    .meta-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #7E93B8;
      margin-bottom: 4px;
    }

    .meta-value {
      font-size: 14.5px;
      font-weight: 700;
      color: #FFFFFF;
    }
    .meta-value.accent {
      color: #4AA4FF;
    }

    /* Professional Action Buttons */
    .button-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
    }

    .action-btn {
      width: 100%;
      height: 52px;
      border-radius: 16px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-telegram {
      background: linear-gradient(135deg, #26A5E4 0%, #0088CC 100%);
      color: #FFFFFF;
      box-shadow: 0 8px 24px rgba(38, 165, 228, 0.35);
    }
    .btn-telegram:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(38, 165, 228, 0.48);
    }
    .btn-telegram:active {
      transform: translateY(1px);
    }

    .btn-max {
      background: linear-gradient(135deg, #7A5AF8 0%, #5E3AE8 100%);
      color: #FFFFFF;
      box-shadow: 0 8px 24px rgba(122, 90, 248, 0.35);
    }
    .btn-max:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(122, 90, 248, 0.48);
    }
    .btn-max:active {
      transform: translateY(1px);
    }

    .btn-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Official Footer */
    .widget-footer {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 16px;
    }

    .emblem-shield {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
    }

    .footer-text {
      text-align: left;
      font-size: 11px;
      line-height: 1.4;
      color: #7E93B8;
    }
    .footer-text strong {
      color: #E2E8F0;
      font-weight: 600;
      display: block;
    }
    .footer-text a {
      color: #4AA4FF;
      text-decoration: none;
      font-weight: 500;
    }
    .footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <!-- Official High-Resolution Header -->
    <div class="widget-header">
      <button class="close-btn" aria-label="Close" onclick="this.closest('.widget-container').style.display='none'">×</button>
      
      <div class="logo-container">
        <img src="official_banner_logo.png" alt="Russia–Africa 2026 | Roscongress Foundation">
      </div>
    </div>

    <!-- Official Summit Body -->
    <div class="widget-body">
      
      <div class="diplomatic-tag">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
        </svg>
        <span>Official Diplomatic Invitation</span>
      </div>

      <h1 class="title-main">Russia–Africa 2026</h1>
      <p class="title-sub">Economic and Humanitarian Forum</p>

      <!-- Key Dates & Location Card -->
      <div class="event-meta-card">
        <div class="meta-item">
          <span class="meta-label">Date</span>
          <span class="meta-value">28–29 October 2026</span>
        </div>
        <div class="meta-divider"></div>
        <div class="meta-item">
          <span class="meta-label">Location</span>
          <span class="meta-value accent">Moscow, Russia</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="button-stack">
        <button class="action-btn btn-telegram" onclick="window.location.href='tg://resolve?domain=summilafrica_info_bot&appname=startforum2026'; setTimeout(function(){ window.open('https://t.me/summilafrica_info_bot/startforum2026', '_blank'); }, 500);">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.52 2.77-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .37z"/>
            </svg>
          </span>
          <span>Войти через Telegram</span>
        </button>

        <button class="action-btn btn-max" onclick="alert('Authenticating via MAX...')">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
              <rect width="24" height="24" rx="6" fill="white" fill-opacity="0.2"/>
              <path d="M12 5.5C8.41 5.5 5.5 8.19 5.5 11.5c0 1.83.89 3.47 2.3 4.54l-.6 2.46 2.55-1.13c.72.23 1.48.36 2.25.36 3.59 0 6.5-2.69 6.5-6s-2.91-6-6.5-6zm-1.8 7.8c-.66 0-1.2-.54-1.2-1.2s.54-1.2 1.2-1.2 1.2.54 1.2 1.2-.54 1.2-1.2 1.2zm3.6 0c-.66 0-1.2-.54-1.2-1.2s.54-1.2 1.2-1.2 1.2.54 1.2 1.2-.54 1.2-1.2 1.2z" fill="#ffffff"/>
            </svg>
          </span>
          <span>Войти через MAX</span>
        </button>
      </div>

      <!-- Verified Host & Portal Footer -->
      <div class="widget-footer">
        <div class="emblem-shield">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="#E5B256">
            <path d="M12 1L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 1ZM10 16.5L6 12.5L7.41 11.09L10 13.67L16.59 7.08L18 8.5L10 16.5Z"/>
          </svg>
        </div>
        <div class="footer-text">
          <strong>Official Organizer · Roscongress Foundation</strong>
          Official portal: <a href="https://summitafrica.ru" target="_blank" rel="noopener">summitafrica.ru</a>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
